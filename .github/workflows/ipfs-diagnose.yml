name: Diagnose IPFS/IPNS reachability

on:
  push:
    branches:
      - claude/github-codebase-fixes-pyxhmc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      NAME: k51qzi5uqu5dimnnsv1csg1hc9ivjmsxpd47fu5l86lbrmpp90k4ua67o48wt9
      CID: bafybeifc7ykqryexwjj3z7o6p6e3xnwlwumw3hkecadjx5swqjjwxzdxmi
    steps:
      - name: Probe
        run: |
          probe() { echo; echo "=== $1"; curl -sS -o /tmp/body -w 'HTTP %{http_code} in %{time_total}s\n' --max-time 60 "${@:2}" || echo "curl failed"; head -c 600 /tmp/body 2>/dev/null | tr -d '\0'; echo; }
          curl -sS --max-time 30 "https://name.web3.storage/name/$NAME" | jq -r .record | base64 -d > /tmp/record.bin
          echo "record bytes: $(wc -c < /tmp/record.bin)"
          probe "PUT record to delegated routing" -X PUT -H 'Content-Type: application/vnd.ipfs.ipns-record' --data-binary @/tmp/record.bin "https://delegated-ipfs.dev/routing/v1/ipns/$NAME"
          sleep 20
          probe "Delegated routing: IPNS record after PUT" -H 'Accept: application/vnd.ipfs.ipns-record' "https://delegated-ipfs.dev/routing/v1/ipns/$NAME"
          sleep 30
          probe "eth.limo site after PUT" -I "https://clifcode.eth.limo/"
