name: Diagnose IPFS/IPNS reachability

on:
  push:
    branches:
      - claude/github-codebase-fixes-pyxhmc

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          NAME=k51qzi5uqu5dimnnsv1csg1hc9ivjmsxpd47fu5l86lbrmpp90k4ua67o48wt9
          CSS=_astro/BaseLayout.fppV9K_i.css
          CID=$(curl -sS --max-time 30 "https://name.web3.storage/name/$NAME" | jq -r .value | sed 's#/ipfs/##')
          echo "Current IPNS value: $CID"
          probe() { echo; echo "=== $1"; curl -sS -o /tmp/body -D /tmp/h -w 'HTTP %{http_code} in %{time_total}s, %{size_download} bytes\n' --max-time 60 "${@:2}" || echo "curl failed"; grep -iE '^(content-type|x-ipfs|etag|cache-control|x-cache|cf-cache)' /tmp/h; head -c 200 /tmp/body | tr -d '\0'; echo; }
          probe "eth.limo home" "https://clifcode.eth.limo/"
          probe "eth.limo stylesheet" "https://clifcode.eth.limo/$CSS"
          probe "eth.limo stylesheet (retry)" "https://clifcode.eth.limo/$CSS"
          probe "Pinata gateway stylesheet" "https://gateway.pinata.cloud/ipfs/$CID/$CSS"
          probe "eth.limo old 404 check" "https://clifcode.eth.limo/_astro/does-not-exist.css"
