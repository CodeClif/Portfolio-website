name: Build and pin IPFS site

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ipfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm install

      - name: Build site
        env:
          DEPLOY_TARGET: ipfs
          SITE_URL: https://clifcode.eth.limo
        run: npm run build

      - name: Upload site to Pinata
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          npm install --no-save pinata multiformats
          node <<'NODE' > /tmp/pinata-result.txt
          const fs = require('fs');
          const path = require('path');
          const { File } = require('node:buffer');
          const { PinataSDK } = require('pinata');
          const { CID } = require('multiformats/cid');
          const { base58btc } = require('multiformats/bases/base58');

          const pinata = new PinataSDK({ pinataJwt: process.env.PINATA_JWT });

          function collectFiles(dir, root = dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => {
              const fullPath = path.join(dir, entry.name);
              if (entry.isDirectory()) return collectFiles(fullPath, root);
              const relativePath = path.relative(root, fullPath).split(path.sep).join('/');
              return [new File([fs.readFileSync(fullPath)], relativePath)];
            });
          }

          (async () => {
            const files = collectFiles('dist');
            if (!files.length) throw new Error('No files found in dist');

            const result = await pinata.upload.public.fileArray(files).name('clifcode-portfolio');
            const cid = CID.parse(result.cid);

            if (cid.code !== 0x70) {
              throw new Error(`Uploaded CID is not dag-pb (codec ${cid.code}); cannot safely convert to CIDv0.`);
            }

            const cidV0 = base58btc.encode(cid.multihash.bytes).slice(1);

            console.log(`CIDv1=${result.cid}`);
            console.log(`CIDv0=${cidV0}`);
          })().catch(error => {
            console.error(error?.message || error);
            process.exit(1);
          });
          NODE

          cat /tmp/pinata-result.txt
          CID_V0="$(sed -n 's/^CIDv0=//p' /tmp/pinata-result.txt)"
          CID_V1="$(sed -n 's/^CIDv1=//p' /tmp/pinata-result.txt)"

          if [ -z "$CID_V0" ] || [ -z "$CID_V1" ]; then
            echo "Could not extract both CIDs"
            exit 1
          fi

          echo "CID_V1=$CID_V1"
          echo "CID_V0=$CID_V0"
          echo "ENS_CONTENT=ipfs://$CID_V0"

          echo "=== New IPFS gateway ==="
          curl -sSIL --max-time 30 "https://ipfs.io/ipfs/$CID_V1/" | sed -n '1,20p' || true

          echo "=== ENS gateway (still points at old CID until ENS is changed) ==="
          curl -sSIL --max-time 30 "https://clifcode.eth.limo/" | sed -n '1,25p' || true
