name: Build and pin IPFS site

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ipfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Upload site to Pinata and verify gateways
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          npm install --no-save pinata
          node <<'NODE' > /tmp/pinata-result.txt
          const fs = require('fs');
          const path = require('path');
          const { File } = require('node:buffer');
          const { PinataSDK } = require('pinata');

          const pinata = new PinataSDK({ pinataJwt: process.env.PINATA_JWT });

          function collectFiles(dir, root = dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => {
              const fullPath = path.join(dir, entry.name);
              if (entry.isDirectory()) return collectFiles(fullPath, root);
              const relativePath = path.relative(root, fullPath).split(path.sep).join('/');
              return [new File([fs.readFileSync(fullPath)], relativePath)];
            });
          }

          (async () => {
            const files = collectFiles('dist');
            if (!files.length) throw new Error('No files found in dist');
            const result = await pinata.upload.public.fileArray(files).name('clifcode-portfolio');
            console.log(result.cid);
          })().catch(error => {
            console.error(error?.message || error);
            process.exit(1);
          });
          NODE

          CID="$(tail -n 1 /tmp/pinata-result.txt)"
          echo "CID=$CID"
          echo "CID=$CID" >> "$GITHUB_ENV"

          echo "=== IPFS gateway headers ==="
          curl -sSIL --max-time 30 "https://ipfs.io/ipfs/$CID/" | sed -n '1,25p'

          echo "=== ENS gateway headers ==="
          curl -sSIL --max-time 30 "https://clifcode.eth.limo/" | sed -n '1,35p'

          echo "=== ENS gateway body marker ==="
          curl -sSL --max-time 30 "https://clifcode.eth.limo/" -o /tmp/clifcode.html
          head -c 120 /tmp/clifcode.html
          echo
