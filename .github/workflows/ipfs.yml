name: Build and pin IPFS site

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ipfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Upload site to Pinata
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          npm install --no-save @pinata/sdk
          node <<'NODE'
          const pinataSDK = require('@pinata/sdk');
          const pinata = new pinataSDK({ pinataJWTKey: process.env.PINATA_JWT });

          (async () => {
            await pinata.testAuthentication();

            const result = await pinata.pinFromFS('dist', {
              pinataMetadata: {
                name: 'clifcode-portfolio'
              },
              pinataOptions: {
                cidVersion: 1,
                wrapWithDirectory: false
              }
            });

            console.log('IPFS CID:', result.IpfsHash);
            console.log('Pin size:', result.PinSize);
          })().catch((error) => {
            console.error('Pinata upload failed:', error?.response?.data || error?.message || error);
            process.exit(1);
          });
          NODE
