name: Build and pin IPFS site

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ipfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm install

      - name: Build site
        env:
          DEPLOY_TARGET: ipfs
          SITE_URL: https://clifcode.eth.limo
        run: npm run build

      - name: Upload site to Pinata and verify gateways
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          npm install --no-save @pinata/sdk
          node <<'NODE' > /tmp/pinata-result.txt
          const pinataSDK = require('@pinata/sdk');
          const pinata = new pinataSDK({ pinataJWTKey: process.env.PINATA_JWT });

          (async () => {
            await pinata.testAuthentication();

            const result = await pinata.pinFromFS('dist', {
              pinataMetadata: {
                name: 'clifcode-portfolio'
              },
              pinataOptions: {
                cidVersion: 0,
                wrapWithDirectory: true
              }
            });

            console.log(result.IpfsHash);
          })().catch(error => {
            console.error(error?.response?.data || error?.message || error);
            process.exit(1);
          });
          NODE

          echo "=== IPFS gateway headers ==="
          curl -sSIL --max-time 30 "https://ipfs.io/ipfs/$CID/" | sed -n '1,25p'

          echo "=== ENS gateway headers ==="
          curl -sSIL --max-time 30 "https://clifcode.eth.limo/" | sed -n '1,35p'

          echo "=== ENS gateway body marker ==="
          curl -sSL --max-time 30 "https://clifcode.eth.limo/" -o /tmp/clifcode.html
          head -c 120 /tmp/clifcode.html
          echo
