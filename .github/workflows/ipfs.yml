name: Build and pin IPFS site

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ipfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Upload site to Pinata
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          npm install --no-save pinata
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { File } = require('node:buffer');
          const { PinataSDK } = require('pinata');

          const pinata = new PinataSDK({
            pinataJwt: process.env.PINATA_JWT
          });

          function collectFiles(dir, root = dir) {
            const entries = fs.readdirSync(dir, { withFileTypes: true });
            const files = [];

            for (const entry of entries) {
              const fullPath = path.join(dir, entry.name);

              if (entry.isDirectory()) {
                files.push(...collectFiles(fullPath, root));
              } else {
                const relativePath = path.relative(root, fullPath).split(path.sep).join('/');
                files.push(new File([fs.readFileSync(fullPath)], relativePath));
              }
            }

            return files;
          }

          (async () => {
            const files = collectFiles('dist');
            if (!files.length) throw new Error('No files found in dist');

            console.log('Uploading', files.length, 'files to Pinata...');

            const result = await pinata.upload.public.fileArray(files)
              .name('clifcode-portfolio');

            console.log('IPFS CID:', result.cid);
            console.log('Pin size:', result.size);
            console.log('Files:', result.number_of_files);
          })().catch((error) => {
            console.error('Pinata upload failed:', error?.response?.data || error?.message || error);
            process.exit(1);
          });
          NODE
